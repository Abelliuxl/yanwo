# 燕云十六声（国服）—— 燕窝 Yanwo 配方
#
# 这个文件把"怎么装、怎么起、怎么收尾"全部数据化。改游戏不用改代码。
# 协议见 docs/RECIPES.md；踩坑原因见 docs/DEV-NOTES.md。

id = "yysls-guofu"
name = "燕云十六声（国服）"
subtitle = "网易国服 · 极速版 · GE-Proton"
launcher_kind = "wine"

[vars]
# Proton 前缀（P1 复用 Steam 已经建好的那个；以后可由燕窝自管）
compatdata = "~/.local/share/Steam/steamapps/compatdata/2885173776"
prefix = "${compatdata}/pfx"

# ---------------- 首次安装（P1 仅记录，不自动执行） ----------------
[install]
kind = "wine_installer"
installer_url = "https://h72.gdl.netease.com/yysls_1.9.36_netease_setup.exe"
installer_file = "~/Games/yysls/yysls_1.9.36_netease_setup.exe"
expect_user_gui = true          # 安装器需要用户点几下（选极速版、等下载）

# 启动链
# ----------------
# 一个 step = 一个进程。多数游戏只有一步（官方启动器）；后续可能多步（更新器 → 启动器 …）
#
# ① 启动器是 Qt 程序，在 4K+300% 缩放下会以 ~120MB/s 泄漏显存（曾 7 分钟涨到 43GB → 死锁冻机）。
#    强制 Qt 软件渲染后稳定在 ~90MB（见 ③ 的 env）。这是**必须**的，别删。
# ② 游戏本体是 D3D12，必须强制 VKD3D-Proton + DXVK（见下面 dll_overrides / dll_paths）。
[[steps]]
kind = "wine"
prefix = "${prefix}"
workdir = "${prefix}/drive_c/Program Files/yysls/Win32/deploy"
exe = "launcher.exe"
wine = "${proton_wine}"
proton_dir = "${proton_dir}"

# ② 游戏本体是 D3D12。普通 wine 会挑自带的旧 vkd3d（libvkd3d-1.dll），游戏一进 InitState 就空指针闪退。
#    必须按 Proton 的做法强制用 VKD3D-Proton + DXVK（下面的 dll_overrides / dll_paths）。
dll_overrides = [
  "d3d11=n,b", "d3d10core=n,b", "d3d10=n,b", "d3d10_1=n,b",
  "d3d9=n,b", "dxgi=n,b", "d3d12=n,b", "d3d12core=n,b",
]
dll_paths = [
  "${proton_lib}/wine/vkd3d-proton",
  "${proton_lib}/vkd3d",
  "${proton_lib}/wine",
]

# ③ 附加环境变量。⚠️ TOML 坑：`[steps.env]` 会把“当前表”切到 env，
#    所以这个子表必须放在该 step 所有普通键之后。
[steps.env]
QT_OPENGL = "software"
QT_QUICK_BACKEND = "software"
# 光标保持系统原装（不做自创光标：Wine/Qt 会反复重设，抢过来不可靠）

# ---------------- 进程识别（用于状态机，不靠父子关系） ----------------
[detect]
launcher_procs = ["launcher.exe"]
game_procs = ["yysls.exe"]

# ---------------- 退出规则 ----------------
[policy]
on_game_exit = "wait_launcher"     # 燕云的官方启动器是常驻的：游戏退了它在，用户可能再进
on_launcher_exit = "return_to_hub"
kill_orphan_wine = true            # 收尾时清掉残留 wine 进程组

# ---------------- 显存安全阀（独立 vram-guard.service 在跑时会让位给它） ----------------
[safety]
max_group_vram_gb = 8
max_growth_gb = 4
window_seconds = 60
max_global_vram_pct = 92
graceful_close_first = true        # 先发窗口关闭事件再杀（否则下载缓存被判损坏 → 重下 125G）

# ---------------- 窗口规则（每个游戏都可能不一样 → 在配方里声明，代码不写死） ----------------
# 实测支持情况（2026-10-04）：
#   game mode：只有 lower / close 这类"不依赖 WM 重排"的动作有效；
#              raise / focus / move / resize / remap 会被 gamescope(steamcompmgr) 忽略，
#              引擎会把"没生效"写进日志（见 docs/DEV-NOTES.md 14）。
#   desktop mode（KWin）：全部有效。
[windows]
enabled = true
watch_seconds = 180          # 进游戏后观察多久（窗口是陆续冒出来的）

# ⚠️ 2026-10-04 实测：lower 只改了 X 的堆叠顺序，**gamescope 的视觉层级不跟它走**，
#    所以"压到底层"在 game mode 下看着没变化。真正治本的是让它消失：
#      close = 发 WM_DELETE_WINDOW（等于点右上角 X，应用自己关；推荐）
#      hide  = unmap（我们直接藏，应用不知道）
#    如果 close 会让游戏流程出问题，就换成 ["hide"]。
[[windows.rules]]
name = "年龄提示关掉（别挡着登录窗）"
match = "MpayAgeTipsForm"
actions = ["close"]
repeat_seconds = 10
priority = 20

[[windows.rules]]
name = "登录窗置前"
match = "^(登录|Login)$"
actions = ["focus"]          # desktop 下有效；game mode 下会被忽略（有回读日志，不会假装成功）
priority = 10

# ---------------- 输入桥（P2 实现） ----------------
[bridge]
active_when = ["hub", "launcher"]  # Hub 和官方启动器阶段一直开
profile = "cursor_click"
backend = "auto"                   # 自动：XTest → xdotool（零 root）
enabled = true

# 游戏本体阶段**默认关**（游戏自己管手柄），但只要出现下面这些"UI 窗口"就把光标桥打开：
# 登录窗、年龄提示、公告/活动弹窗、设置面板……（游戏本体自己不吃手柄，这些窗口手柄点不了）
cursor_windows = [
  "^(登录|Login|登入)",
  "^Mpay",
  "公告|通知|提示",
  "^(设置|选项|Options|Settings)",
  "实名|验证|码",
  "确认|continue|Continue",
]
cursor_on_dialogs = true           # 保险：任何"弹窗类"窗口（WM_TRANSIENT_FOR 非 0）也开

# 暂停组合键：Select + X，按一次暂停输入桥（唤出 Steam 覆盖界面/切窗口时不会再打架），再按恢复
pause_combo = ["select", "third"]
# 如果某个窗口一出现就应该暂停桥，把标题正则写这里（Steam 覆盖界面通常没有 X 窗口，故靠快捷键兜底）
pause_windows = []
